name: World Cup Alerts

on:
  workflow_dispatch:

jobs:
  check-worldcup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Check for World Cup games
      run: |
        TODAY=$(TZ='America/New_York' date +%Y%m%d)
        YESTERDAY=$(TZ='America/New_York' date -d 'yesterday' +%Y%m%d)
        CURRENT_DATE_EST=$(TZ='America/New_York' date +%Y%m%d)
        
        echo "Current date EST: $CURRENT_DATE_EST"
        
        curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=$TODAY" > worldcup_today.json
        curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=$YESTERDAY" > worldcup_yesterday.json
        
        touch alerted_games.txt
        
        cat << 'EOF' > check_worldcup.py
        import json
        import os
        import urllib.request
        from datetime import datetime, timezone
        
        current_date = os.environ.get('CURRENT_DATE_EST', '')
        yesterday_date = os.environ.get('YESTERDAY_DATE_EST', '')
        
        TEAM_GROUPS = {
            'Mexico': 'Group A', 'South Korea': 'Group A', 'Korea Republic': 'Group A', 'Czechia': 'Group A', 'Czech Republic': 'Group A', 'South Africa': 'Group A',
            'Switzerland': 'Group B', 'Canada': 'Group B', 'Qatar': 'Group B', 'Bosnia-Herzegovina': 'Group B', 'Bosnia and Herzegovina': 'Group B',
            'Brazil': 'Group C', 'Haiti': 'Group C', 'Morocco': 'Group C', 'Scotland': 'Group C',
            'United States': 'Group D', 'USA': 'Group D', 'Turkiye': 'Group D', 'Turkey': 'Group D', 'Australia': 'Group D', 'Paraguay': 'Group D',
            'Germany': 'Group E', 'Curacao': 'Group E', 'Ivory Coast': 'Group E', 'Ecuador': 'Group E',
            'Netherlands': 'Group F', 'Japan': 'Group F', 'Sweden': 'Group F', 'Tunisia': 'Group F',
            'Belgium': 'Group G', 'Egypt': 'Group G', 'Iran': 'Group G', 'IR Iran': 'Group G', 'New Zealand': 'Group G',
            'Spain': 'Group H', 'Cape Verde': 'Group H', 'Saudi Arabia': 'Group H', 'Uruguay': 'Group H',
            'France': 'Group I', 'Senegal': 'Group I', 'Iraq': 'Group I', 'Norway': 'Group I',
            'Argentina': 'Group J', 'Algeria': 'Group J', 'Austria': 'Group J', 'Jordan': 'Group J',
            'Portugal': 'Group K', 'Congo DR': 'Group K', 'Uzbekistan': 'Group K', 'Colombia': 'Group K',
            'England': 'Group L', 'Croatia': 'Group L', 'Ghana': 'Group L', 'Panama': 'Group L'
        }
        
        TEAM_FLAGS = {
            'Mexico': ':flag-mx:', 'South Korea': ':flag-kr:', 'Korea Republic': ':flag-kr:', 'Czechia': ':flag-cz:', 'Czech Republic': ':flag-cz:', 'South Africa': ':flag-za:',
            'Switzerland': ':flag-ch:', 'Canada': ':flag-ca:', 'Qatar': ':flag-qa:', 'Bosnia-Herzegovina': ':flag-ba:', 'Bosnia and Herzegovina': ':flag-ba:',
            'Brazil': ':flag-br:', 'Haiti': ':flag-ht:', 'Morocco': ':flag-ma:', 'Scotland': ':flag-scotland:',
            'United States': ':flag-us:', 'USA': ':flag-us:', 'Turkiye': ':flag-tr:', 'Turkey': ':flag-tr:', 'Australia': ':flag-au:', 'Paraguay': ':flag-py:',
            'Germany': ':flag-de:', 'Curacao': ':flag-cw:', 'Ivory Coast': ':flag-ci:', 'Ecuador': ':flag-ec:',
            'Netherlands': ':flag-nl:', 'Japan': ':flag-jp:', 'Sweden': ':flag-se:', 'Tunisia': ':flag-tn:',
            'Belgium': ':flag-be:', 'Egypt': ':flag-eg:', 'Iran': ':flag-ir:', 'IR Iran': ':flag-ir:', 'New Zealand': ':flag-nz:',
            'Spain': ':flag-es:', 'Cape Verde': ':flag-cv:', 'Saudi Arabia': ':flag-sa:', 'Uruguay': ':flag-uy:',
            'France': ':flag-fr:', 'Senegal': ':flag-sn:', 'Iraq': ':flag-iq:', 'Norway': ':flag-no:',
            'Argentina': ':flag-ar:', 'Algeria': ':flag-dz:', 'Austria': ':flag-at:', 'Jordan': ':flag-jo:',
            'Portugal': ':flag-pt:', 'Congo DR': ':flag-cd:', 'Uzbekistan': ':flag-uz:', 'Colombia': ':flag-co:',
            'England': ':flag-england:', 'Croatia': ':flag-hr:', 'Ghana': ':flag-gh:', 'Panama': ':flag-pa:'
        }
        
        all_events = []
        
        try:
            with open('worldcup_today.json', 'r') as f:
                data = json.load(f)
                if 'events' in data:
                    all_events.extend(data['events'])
        except:
            pass
        
        try:
            with open('worldcup_yesterday.json', 'r') as f:
                data = json.load(f)
                if 'events' in data:
                    all_events.extend(data['events'])
        except:
            pass
        
        alerted_games = set()
        try:
            with open('alerted_games.txt', 'r') as f:
                content = f.read().strip()
                if content:
                    alerted_games = set(content.split(','))
        except:
            pass
        
        # Don't filter by date - keep all alerts to prevent duplicates
        # File will accumulate but stay small (only a few hundred entries max)
        
        starting_soon_games = []
        final_score_games = []
        
        print(f"\nUsing date EST: {current_date}")
        print(f"Total games found: {len(all_events)}")
        
        if all_events:
            print(f"\nAll games:")
            for event in all_events:
                try:
                    competition = event['competitions'][0]
                    status = competition['status']['type']['name']
                    status_detail = competition['status']['type']['detail']
                    home_team = next((t for t in competition['competitors'] if t['homeAway'] == 'home'), None)
                    away_team = next((t for t in competition['competitors'] if t['homeAway'] == 'away'), None)
                    if home_team and away_team:
                        print(f"  {away_team['team']['displayName']} vs {home_team['team']['displayName']} [{status_detail}]")
                except:
                    pass
        
        for event in all_events:
            try:
                game_id = event['id']
                competition = event['competitions'][0]
                status = competition['status']['type']['name']
                game_date = competition.get('date')
                
                home_team = next((t for t in competition['competitors'] if t['homeAway'] == 'home'), None)
                away_team = next((t for t in competition['competitors'] if t['homeAway'] == 'away'), None)
                
                if not home_team or not away_team:
                    continue
                
                away_name = away_team['team']['displayName']
                home_name = home_team['team']['displayName']
                away_score = away_team.get('score', 0)
                home_score = home_team.get('score', 0)
                
                group_info = TEAM_GROUPS.get(away_name, TEAM_GROUPS.get(home_name, 'Group Unknown'))
                away_flag = TEAM_FLAGS.get(away_name, '')
                home_flag = TEAM_FLAGS.get(home_name, '')
                
                # Tracking keys WITHOUT date - prevents midnight duplicates
                starting_key = f"{game_id}_starting"
                final_key = f"{game_id}_final"
                
                if status == 'STATUS_SCHEDULED' and game_date and starting_key not in alerted_games:
                    game_start = datetime.fromisoformat(game_date.replace('Z', '+00:00'))
                    current_time_utc = datetime.now(timezone.utc)
                    minutes_until = int((game_start - current_time_utc).total_seconds() / 60)
                    
                    if 0 <= minutes_until <= 15:
                        broadcast = competition.get('broadcasts', [{}])[0].get('names', ['No TV info'])[0] if competition.get('broadcasts') else 'No TV info'
                        
                        starting_soon_games.append({
                            'away_team': away_name,
                            'home_team': home_name,
                            'away_flag': away_flag,
                            'home_flag': home_flag,
                            'minutes_until': minutes_until,
                            'broadcast': broadcast,
                            'group': group_info
                        })
                        alerted_games.add(starting_key)
                        
                        with open('alerted_games.txt', 'w') as f:
                            f.write(','.join(sorted(alerted_games)))
                
                if (status == 'STATUS_FULL_TIME' or status == 'STATUS_FINAL') and final_key not in alerted_games:
                    broadcast = competition.get('broadcasts', [{}])[0].get('names', ['No TV info'])[0] if competition.get('broadcasts') else 'No TV info'
                    
                    final_score_games.append({
                        'away_team': away_name,
                        'home_team': home_name,
                        'away_flag': away_flag,
                        'home_flag': home_flag,
                        'away_score': away_score,
                        'home_score': home_score,
                        'broadcast': broadcast,
                        'group': group_info
                    })
                    alerted_games.add(final_key)
                    
                    with open('alerted_games.txt', 'w') as f:
                        f.write(','.join(sorted(alerted_games)))
                        
            except Exception as e:
                print(f"Error: {e}")
        
        webhook_url = os.environ.get('SLACK_WEBHOOK_URL')
        
        all_alerts = starting_soon_games + final_score_games
        
        if all_alerts and webhook_url:
            for game in all_alerts:
                if game.get('minutes_until') is not None:
                    slack_message = {
                        "text": f"🏆 WORLD CUP STARTING: {game['away_team']} vs {game['home_team']} in ~{game['minutes_until']} minutes",
                        "blocks": [
                            {
                                "type": "header",
                                "text": {
                                    "type": "plain_text",
                                    "text": "🏆 WORLD CUP - GAME STARTING",
                                    "emoji": True
                                }
                            },
                            {
                                "type": "section",
                                "text": {
                                    "type": "mrkdwn",
                                    "text": f"*{game['away_team']}* {game['away_flag']} vs {game['home_flag']} *{game['home_team']}*"
                                }
                            },
                            {
                                "type": "context",
                                "elements": [
                                    {
                                        "type": "mrkdwn",
                                        "text": f"📋 {game['group']} • ⏰ Starting in ~{game['minutes_until']} minutes • 📺 {game['broadcast']}"
                                    }
                                ]
                            }
                        ]
                    }
                else:
                    slack_message = {
                        "text": f"🏆 WORLD CUP FINAL: {game['away_team']} {game['away_score']} - {game['home_score']} {game['home_team']}",
                        "blocks": [
                            {
                                "type": "header",
                                "text": {
                                    "type": "plain_text",
                                    "text": "🏆 WORLD CUP - FINAL SCORE",
                                    "emoji": True
                                }
                            },
                            {
                                "type": "section",
                                "fields": [
                                    {
                                        "type": "mrkdwn",
                                        "text": f"{game['away_team']} {game['away_flag']}\n{game['away_score']}"
                                    },
                                    {
                                        "type": "mrkdwn",
                                        "text": f"{game['home_team']} {game['home_flag']}\n{game['home_score']}"
                                    }
                                ]
                            },
                            {
                                "type": "context",
                                "elements": [
                                    {
                                        "type": "mrkdwn",
                                        "text": f"📋 {game['group']} • 📺 {game['broadcast']}"
                                    }
                                ]
                            }
                        ]
                    }
                
                req = urllib.request.Request(
                    webhook_url,
                    data=json.dumps(slack_message).encode('utf-8'),
                    headers={'Content-Type': 'application/json'}
                )
                
                try:
                    with urllib.request.urlopen(req) as response:
                        if game.get('minutes_until') is not None:
                            print(f"Sent starting: {game['away_team']} vs {game['home_team']}")
                        else:
                            print(f"Sent final: {game['away_team']} {game['away_score']} - {game['home_score']} {game['home_team']}")
                except Exception as e:
                    print(f"Error: {e}")
        else:
            print("\nNo new alerts.")
        
        with open('alerted_games.txt', 'w') as f:
            f.write(','.join(sorted(alerted_games)))
        
        print(f"Alerted games today: {len(alerted_games)}")
        EOF
        
        export CURRENT_DATE_EST
        export YESTERDAY_DATE_EST=$YESTERDAY
        python3 check_worldcup.py
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Commit state file
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add alerted_games.txt || true
        git commit -m "Update alerted games state [skip ci]" || true
        git push || true
