name: World Cup Final Scores

on:
  workflow_dispatch:

jobs:
  check-worldcup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Check for World Cup finals
      run: |
        TODAY=$(TZ='America/New_York' date +%Y%m%d)
        
        echo "Fetching World Cup games..."
        curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=$TODAY" > worldcup.json
        
        touch alerted_games.txt
        
        cat << 'EOF' > check_worldcup.py
        import json
        import os
        import urllib.request
        from datetime import datetime
        
        with open('worldcup.json', 'r') as f:
            data = json.load(f)
        
        alerted_games = set()
        try:
            with open('alerted_games.txt', 'r') as f:
                content = f.read().strip()
                if content:
                    alerted_games = set(content.split(','))
        except:
            pass
        
        current_date = datetime.now().strftime('%Y%m%d')
        alerted_games = {g for g in alerted_games if g.startswith(current_date)}
        
        final_score_games = []
        
        print(f"\n🏆 World Cup Summary:")
        print(f"Total games found: {len(data.get('events', []))}")
        
        if 'events' in data and data['events']:
            for event in data['events']:
                try:
                    game_id = event['id']
                    competition = event['competitions'][0]
                    status = competition['status']['type']['name']
                    
                    home_team = next((t for t in competition['competitors'] if t['homeAway'] == 'home'), None)
                    away_team = next((t for t in competition['competitors'] if t['homeAway'] == 'away'), None)
                    
                    if not home_team or not away_team:
                        continue
                    
                    away_name = away_team['team']['displayName']
                    home_name = home_team['team']['displayName']
                    away_score = away_team['score']
                    home_score = home_team['score']
                    
                    # Get group information
                    group_info = event.get('season', {}).get('type', {}).get('abbreviation', '')
                    if not group_info:
                        # Try alternate location for group
                        group_info = competition.get('notes', [{}])[0].get('headline', '') if competition.get('notes') else ''
                    if not group_info:
                        group_info = 'Group Unknown'
                    
                    final_key = f"{current_date}_{game_id}_final"
                    
                    if status == 'STATUS_FINAL' and final_key not in alerted_games:
                        broadcast = competition.get('broadcasts', [{}])[0].get('names', ['No TV info'])[0] if competition.get('broadcasts') else 'No TV info'
                        
                        final_score_games.append({
                            'away_team': away_name,
                            'home_team': home_name,
                            'away_score': away_score,
                            'home_score': home_score,
                            'broadcast': broadcast,
                            'group': group_info
                        })
                        alerted_games.add(final_key)
                        
                        with open('alerted_games.txt', 'w') as f:
                            f.write(','.join(sorted(alerted_games)))
                        
                        print(f"  → Final alert queued: {away_name} {away_score} - {home_score} {home_name} ({group_info})")
                except Exception as e:
                    print(f"Error: {e}")
        
        webhook_url = os.environ.get('SLACK_WEBHOOK_URL')
        
        if final_score_games and webhook_url:
            for game in final_score_games:
                slack_message = {
                    "text": f"🏆 WORLD CUP FINAL: {game['away_team']} {game['away_score']} - {game['home_score']} {game['home_team']} ({game['group']})",
                    "blocks": [
                        {
                            "type": "header",
                            "text": {
                                "type": "plain_text",
                                "text": "🏆 WORLD CUP - FINAL SCORE",
                                "emoji": True
                            }
                        },
                        {
                            "type": "section",
                            "fields": [
                                {
                                    "type": "mrkdwn",
                                    "text": f"*{game['away_team']}*\n{game['away_score']}"
                                },
                                {
                                    "type": "mrkdwn",
                                    "text": f"*{game['home_team']}*\n{game['home_score']}"
                                }
                            ]
                        },
                        {
                            "type": "context",
                            "elements": [
                                {
                                    "type": "mrkdwn",
                                    "text": f"📋 {game['group']} • 📺 {game['broadcast']}"
                                }
                            ]
                        }
                    ]
                }
                
                req = urllib.request.Request(
                    webhook_url,
                    data=json.dumps(slack_message).encode('utf-8'),
                    headers={'Content-Type': 'application/json'}
                )
                
                try:
                    with urllib.request.urlopen(req) as response:
                        print(f"✓ Sent final: {game['away_team']} {game['away_score']} - {game['home_score']} {game['home_team']}")
                except Exception as e:
                    print(f"✗ Error: {e}")
        else:
            print("\nNo new final score alerts.")
        
        with open('alerted_games.txt', 'w') as f:
            f.write(','.join(sorted(alerted_games)))
        
        print(f"\nAlerted games today: {len(alerted_games)}")
        EOF
        
        python3 check_worldcup.py
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Commit state file
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add alerted_games.txt || true
        git commit -m "Update alerted games state [skip ci]" || true
        git push || true
